<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<title>FESTA 검수</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; height: 100vh; display: flex; flex-direction: column;
         font: 14px/1.5 -apple-system, "Apple SD Gothic Neo", sans-serif; }
  header { display: flex; gap: 8px; align-items: center;
           padding: 8px 12px; border-bottom: 1px solid #ddd; }
  header .sp { flex: 1; }
  #log { margin: 0; padding: 8px 12px; max-height: 180px; overflow: auto;
         background: #111; color: #ddd; font-size: 12px; white-space: pre-wrap; }
  main { display: flex; flex: 1; min-height: 0; }
  nav { width: 300px; border-right: 1px solid #ddd; display: flex; flex-direction: column; }
  #filters { display: flex; gap: 4px; padding: 8px; border-bottom: 1px solid #eee; }
  #filters button.on { background: #222; color: #fff; }
  #list { flex: 1; overflow: auto; margin: 0; padding: 0; list-style: none; }
  #list li { padding: 6px 10px; cursor: pointer; border-bottom: 1px solid #f2f2f2; }
  #list li.sel { background: #eef4ff; }
  #list li.bad .flag { color: #c00; font-weight: 700; }
  #list li .flag { font-size: 11px; color: #999; margin-right: 6px; }
  #detail { flex: 1; overflow: auto; padding: 12px 16px; }
  table { border-collapse: collapse; width: 100%; margin-bottom: 16px; }
  th, td { text-align: left; padding: 4px 8px; border-bottom: 1px solid #eee;
           vertical-align: top; }
  th { width: 140px; color: #666; font-weight: 500; }
  iframe { width: 100%; height: 520px; border: 1px solid #ddd; }
  .raw { color: #999; }
</style>

<header>
  <button id="run-crawl">전체 크롤</button>
  <button id="run-enrich">enrich</button>
  <span id="status">대기 중</span>
  <span class="sp"></span>
  <button id="log-toggle">로그</button>
</header>
<pre id="log" hidden></pre>
<main>
  <nav>
    <div id="filters">
      <button data-filter="problem" class="on">문제만</button>
      <button data-filter="search">검색출처</button>
      <button data-filter="all">전체</button>
      <button data-filter="artists">아티스트</button>
    </div>
    <ul id="list"></ul>
  </nav>
  <section id="detail"></section>
</main>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g,
  (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
// esc()는 HTML 이스케이프일 뿐 URL 스킴은 걸러내지 않는다 — href/src에 넣기 전 별도로 검사한다.
const safeUrl = (u) => /^https?:\/\//i.test(u ?? "") ? u : "";

let data = { festivals: [], lineup: [], artists: [] };
let filter = "problem";
let selected = 0;
let logFrom = 0;
let polling = null;

async function load(retry = true) {
  const res = await fetch("/api/data");
  if (!res.ok) {
    // crawl이 쓰는 중일 수 있다 — 한 번만 재시도하고, 그래도 안 되면 화면에 알린다.
    if (retry) { $("status").textContent = "데이터 로드 실패 — 재시도 중…"; setTimeout(() => load(false), 1500); }
    else { $("status").textContent = "데이터 로드 실패"; }
    return;
  }
  if ($("status").textContent.startsWith("데이터 로드 실패")) $("status").textContent = "대기 중";
  data = await res.json();
  render();
}

function visible() {
  if (filter === "search") return data.festivals.filter((r) => r.discovery === "SITEMAP" || r.discovery === "SEARCH");
  if (filter === "all") return data.festivals;
  return data.festivals.filter((r) => r.flag !== "OK");
}

function render() {
  if (filter === "artists") return renderArtists();
  const rows = visible();
  if (selected >= rows.length) selected = Math.max(0, rows.length - 1);
  $("list").innerHTML = rows.map((r, i) => `
    <li class="${i === selected ? "sel" : ""} ${r.flag === "OK" ? "" : "bad"}" data-i="${i}">
      <span class="flag">${esc(r.flag)}</span>${esc(r.host_name)}
    </li>`).join("");
  renderDetail(rows[selected]);
}

function renderDetail(f) {
  if (!f) { $("detail").innerHTML = "<p>표시할 축제가 없습니다.</p>"; return; }
  // import_key가 없는 행(구 스키마 잔존)까지 undefined === undefined로 걸리지 않도록 truthy를 먼저 본다.
  const lineup = data.lineup.filter((l) => l.import_key && l.import_key === f.import_key);
  const url = safeUrl(f.source_url);
  const tags = (f.hashtags || "").split("|").filter(Boolean).map((h) => "#" + h).join(" ");
  const fields = [
    ["축제명", f.name], ["기간", `${f.start_date} ~ ${f.end_date}`],
    ["장소", f.venue_name], ["소개", f.description], ["해시태그", tags],
    ["외부인", f.external_visitor_policy], ["확인 방식", f.verification_method],
    ["티켓", f.ticket_type], ["예매 오픈", f.ticket_open_at],
    ["판단 근거", f.admission_raw], ["인스타", f.instagram_url],
    ["포스터", f.poster_url], ["이미지", f.image_urls],
    ["출처", f.discovery], ["flag", f.flag],
  ];
  $("detail").innerHTML = `
    <h2>${esc(f.import_key)}</h2>
    <p>
      <button class="rerun" data-uni="${esc(f.host_name)}" data-rediscover="0">다시 돌리기</button>
      <button class="rerun" data-uni="${esc(f.host_name)}" data-rediscover="1">탐색부터</button>
    </p>
    <table>${fields.map(([k, v]) =>
      `<tr><th>${esc(k)}</th><td>${esc(v) || "—"}</td></tr>`).join("")}</table>
    <h3>라인업 ${lineup.length}건</h3>
    <table>${lineup.map((l) => `
      <tr><th>${l.day ? esc(l.day) + "일차" : "?"} · ${esc(l.order)}번</th>
          <td>${esc(l.artist_canonical)}
              ${l.artist_canonical !== l.artist_raw
                ? `<span class="raw">← ${esc(l.artist_raw)}</span>` : ""}
              ${l.revealed === "false" ? "🔒" : ""}</td></tr>`).join("")}</table>
    <h3>원본 ${url
      ? `<a href="${esc(url)}" target="_blank" rel="noreferrer">새 탭 ↗</a>` : ""}</h3>
    ${url
      ? `<iframe src="${esc(url)}" sandbox="allow-scripts"
                 referrerpolicy="no-referrer"></iframe>`
      : "<p>출처 URL이 없습니다.</p>"}`;
}

function renderArtists() {
  const rows = [...data.artists].sort(
    (a, b) => (b.needs_review === "true") - (a.needs_review === "true"));
  $("list").innerHTML = "";
  $("detail").innerHTML = `
    <h2>아티스트 ${rows.length}</h2>
    <table><tr><th>대표명</th><td>장르 / 다른 표기</td></tr>
    ${rows.map((a) => `
      <tr><th>${a.needs_review === "true" ? "⚠️ " : ""}${esc(a.name)}</th>
          <td>${esc(a.genre)} / ${esc(a.other_names)}</td></tr>`).join("")}</table>`;
}

async function run(job, hostName, rediscover) {
  const res = await fetch("/api/run", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ job, university: hostName, rediscover }),
  });
  const body = await res.json();
  if (!res.ok) { alert(body.error); return; }
  $("log").hidden = false;
  logFrom = 0;
  $("log").textContent = "";
  pollLog();
}

function pollLog() {
  clearInterval(polling);
  polling = setInterval(async () => {
    const body = await (await fetch(`/api/log?from=${logFrom}`)).json();
    if (body.lines.length) {
      $("log").textContent += body.lines.join("\n") + "\n";
      logFrom += body.lines.length;
      $("log").scrollTop = $("log").scrollHeight;
    }
    $("status").textContent = body.running ? "실행 중…"
      : body.returncode === 0 ? "완료"
      : body.returncode == null ? "대기 중" : `실패 (코드 ${body.returncode})`;
    if (!body.running) { clearInterval(polling); polling = null; load(); }
  }, 1000);
}

$("run-crawl").onclick = () => run("crawl", null, false);
$("run-enrich").onclick = () => run("enrich", null, false);
$("log-toggle").onclick = () => { $("log").hidden = !$("log").hidden; };
$("filters").onclick = (e) => {
  if (e.target.tagName !== "BUTTON") return;
  filter = e.target.dataset.filter;
  selected = 0;
  [...$("filters").children].forEach((b) => b.classList.toggle("on", b === e.target));
  render();
};
$("list").onclick = (e) => {
  const li = e.target.closest("li");
  if (!li) return;
  selected = Number(li.dataset.i);
  render();
};
$("detail").onclick = (e) => {
  const b = e.target.closest("button.rerun");
  if (!b) return;
  run("crawl", b.dataset.uni, b.dataset.rediscover === "1");
};
document.addEventListener("keydown", (e) => {
  if (filter === "artists") return;
  if (e.key === "j") { selected = Math.max(0, Math.min(selected + 1, visible().length - 1)); render(); }
  if (e.key === "k") { selected = Math.max(selected - 1, 0); render(); }
});

load();
pollLog();   // 새로고침이 실행 중인 잡 도중이었으면 "대기 중" 오표시를 막는다 — running=false면 곧장 자체 정리된다.
</script>
</html>
